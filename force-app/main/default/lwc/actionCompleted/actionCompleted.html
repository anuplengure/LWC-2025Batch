<template>
    <lightning-card title="Action Completed">
        <div class="slds-p-around_medium">
            <lightning-button label="Complete Action" variant="brand" onclick={handleAction} disabled={isCompleted}></lightning-button>
            <template if:true={isCompleted}>
                <p class="success-text">
                    Action completed successfully...!!!
                </p>
            </template>
        </div>
    </lightning-card>
</template>
