<template>
    <lightning-card title="Muted Wired Data">
        <lightning-input type="number" label="Count of data to be fetched" ></lightning-input>
        <lightning-button type="brand" label="Get Data" onclick={clickHandler}></lightning-button>
        <template for:each={accList} for:item="acc">
            <div key={acc.Id}>{acc.srNo} - {acc.Name}</div>
        </template>
    </lightning-card>
</template>
