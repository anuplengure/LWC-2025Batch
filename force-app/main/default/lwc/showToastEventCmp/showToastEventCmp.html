<template>
    <lightning-card title="Show Toast Event">
        <lightning-input type="number" label="Enter Count" onchange={changeHandler}></lightning-input>
        <lightning-button variant="brand" label="Get Records" onclick={clickHandler}></lightning-button>
        <template lwc:if={accList}>
            <template for:each={accList} for:item="acc">
                <div key={acc.Id}>{acc.Name}</div>
            </template>
        </template>
        <template lwc:else>
            <div>{error}</div>
        </template>
    </lightning-card>
</template>
