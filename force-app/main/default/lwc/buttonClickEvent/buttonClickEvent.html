<template>
    <lightning-card title="Button Click Event">
        <div class="slds-m-around_medium">
            <lightning-button label="Click Me" variant="brand" onclick={handleClick}>
            </lightning-button>
            <template if:true={showMessage}>
                <p class="slds-m-top_medium slds-text-color_success">
                    Button was clicked!
                </p>
            </template>
        </div>
    </lightning-card>
</template>
