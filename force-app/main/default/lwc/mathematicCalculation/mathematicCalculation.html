<template>
    <lightning-card title="Sharing js code">
        <lightning-input type ="number"  label="First Number" onchange={changeHandler}></lightning-input>
        <lightning-input type ="number" label="Second Number" onchange={changeHandler}></lightning-input>
        <lightning-button variant="brand" label="Addition" onclick={clickHandler}></lightning-button>
        <template lwc:if={result}>
            <div>{first} + {second} = {result}</div>
        </template>
    </lightning-card>
</template>
