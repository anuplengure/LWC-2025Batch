<template >
    
    <lightning-card title="Looping and Iteration">
        
        <h1><strong>Looping using for:each</strong> </h1>
        <template for:each={cityList} for:item="city">
            <div key={city}>{city}</div>
        </template>

        <h1><strong>Iteration using iterator</strong></h1>
        <template iterator:it={cityList}>
            <div key={it.value}>{it.value}</div>
            <div lwc:if={it.first} key={it.first}>First Element : {it.value}</div>
            <div lwc:if={it.last} key={it.last}>Last Element : {it.value}</div>
        </template>
    </lightning-card>
    
</template>
